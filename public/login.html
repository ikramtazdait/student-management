<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System - Login</title>
  <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Student Management System</h1>
        <p>Manage your student database efficiently</p>
      </div>

      <div class="auth-form-container">
        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
          <h2>Login</h2>
          <form id="loginFormElement">
            <div class="form-group">
              <label for="loginUsername">Username:</label>
              <input type="text" id="loginUsername" required placeholder="Enter your username">
            </div>

            <div class="form-group">
              <label for="loginPassword">Password:</label>
              <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
          </form>

          <div class="auth-footer">
            <p>Don't have an account? <a href="#" class="toggle-form" onclick="toggleForm(event)">Register here</a></p>
          </div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
          <h2>Create Account</h2>
          <form id="registerFormElement">
            <div class="form-group">
              <label for="registerUsername">Username:</label>
              <input type="text" id="registerUsername" required placeholder="Choose a username">
            </div>

            <div class="form-group">
              <label for="registerEmail">Email:</label>
              <input type="email" id="registerEmail" required placeholder="Enter your email">
            </div>

            <div class="form-group">
              <label for="registerPassword">Password:</label>
              <input type="password" id="registerPassword" required placeholder="Enter a password (min 6 chars)">
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirm Password:</label>
              <input type="password" id="confirmPassword" required placeholder="Confirm your password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
          </form>

          <div class="auth-footer">
            <p>Already have an account? <a href="#" class="toggle-form" onclick="toggleForm(event)">Login here</a></p>
          </div>
        </div>
      </div>

      <div id="alertMessage" class="alert" style="display: none;"></div>
    </div>
  </div>

  <script src="auth-script.js"></script>
</body>
</html>
