<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>Student Management System</h1>
          <p class="subtitle">Manage your student database efficiently</p>
        </div>
        <div class="user-info">
          <span id="userName">User</span>
          <button class="btn btn-logout" id="logoutBtn">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <!-- Add/Edit Student Form -->
      <section class="form-section">
        <h2>Add New Student</h2>
        <form id="studentForm">
          <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" required placeholder="Enter student name">
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter email address">
          </div>

          <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" placeholder="Enter phone number">
          </div>

          <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" placeholder="Enter address">
          </div>

          <div class="form-group">
            <label for="enrollmentDate">Enrollment Date:</label>
            <input type="date" id="enrollmentDate" required>
          </div>

          <div class="form-group">
            <label for="gpa">GPA:</label>
            <input type="number" id="gpa" min="0" max="4" step="0.01" placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="status">Status:</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="graduated">Graduated</option>
            </select>
          </div>

          <div class="button-group">
            <button type="submit" class="btn btn-primary">Add Student</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Students Table -->
      <section class="table-section">
        <h2>Student List</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by name, email, or phone...">
        </div>
        <div class="table-wrapper">
          <table id="studentsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Enrollment Date</th>
                <th>GPA</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr class="no-data">
                <td colspan="9">No students found. Add one to get started!</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Student Management System. All rights reserved.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
